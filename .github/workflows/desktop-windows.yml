name: Build Windows Desktop Installer

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-port
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Package Windows installer (.exe and .msi)
    # windows-2022 ships WiX Toolset 3, which jpackage needs for .exe/.msi
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure WiX Toolset is available
        run: |
          if ! command -v candle.exe >/dev/null 2>&1 && [ ! -d "/c/Program Files (x86)/WiX Toolset v3.14/bin" ]; then
            echo "WiX not found, installing via Chocolatey"
            choco install wixtoolset -y --no-progress
          else
            echo "WiX already present"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: desktop

      - name: Package installers
        run: ./gradlew --no-daemon packageExe packageMsi

      - name: List outputs
        run: find build/compose/binaries -type f \( -name '*.exe' -o -name '*.msi' \) -exec ls -l {} \;

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: neko-windows-installer
          path: |
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
